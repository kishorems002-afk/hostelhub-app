

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HostelHub</title>

<style>
:root {
  --primary: #603bc4;
  --secondary: #382078;
  --light: #f5f3ff;
  --text: #25213a;
  --danger: #d93045;
  --success: #16834a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6fb;
  color: var(--text);
}
button, input, textarea, select { font: inherit; }
button {
  border: 0;
  padding: 11px 15px;
  border-radius: 9px;
  background: var(--primary);
  color: white;
  cursor: pointer;
  font-weight: 600;
}
button:hover { opacity: .9; }
button.secondary { background: #e9e4fb; color: var(--secondary); }
button.danger { background: var(--danger); }
input, textarea, select {
  width: 100%;
  border: 1px solid #d9d5e7;
  border-radius: 9px;
  padding: 11px;
  margin: 6px 0 14px;
  background: white;
}
textarea { min-height: 80px; resize: vertical; }
label { font-size: 14px; font-weight: 600; }
h1, h2, h3 { margin-top: 0; }
.hidden { display: none !important; }
.muted { color: #716c83; font-size: 13px; }
.error { color: var(--danger); font-size: 14px; }
.success { color: var(--success); font-size: 14px; }
.app-header {
  background: linear-gradient(120deg, var(--secondary), var(--primary));
  color: white;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.brand { font-size: 23px; font-weight: 800; }
.brand span { color: #d9ceff; }
.header-user { display: flex; align-items: center; gap: 10px; }
.header-user img { width: 38px; height: 38px; object-fit: cover; border-radius: 50%; }
.layout { display: flex; min-height: calc(100vh - 75px); }
.sidebar {
  width: 225px;
  flex-shrink: 0;
  padding: 18px 12px;
  background: white;
  border-right: 1px solid #e9e6f2;
}
.nav-btn {
  display: block;
  width: 100%;
  text-align: left;
  margin: 4px 0;
  background: transparent;
  color: #49435f;
}
.nav-btn.active, .nav-btn:hover { background: var(--light); color: var(--primary); }
main { flex: 1; min-width: 0; padding: 24px; }
.page { max-width: 1050px; margin: auto; }
.card {
  background: white;
  border: 1px solid #ece9f5;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px #20104c08;
}
.grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 15px; }
.stat { padding: 20px; border-radius: 14px; background: white; border: 1px solid #ece9f5; }
.stat strong { display: block; font-size: 28px; color: var(--primary); margin-top: 8px; }
.login-wrap {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(140deg, #322064, #8064dc);
}
.login-card { background: white; padding: 28px; border-radius: 20px; width: min(100%, 440px); }
.login-logo { font-size: 30px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1; }
.profile-top { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
.profile-photo {
  width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
  border: 4px solid #e4dcff; background: #f0ecff;
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px; border-bottom: 1px solid #eeeaf5; text-align: left; }
th { color: #655b7f; font-size: 13px; }
.badge { background: #eee9ff; color: var(--secondary); padding: 5px 9px; border-radius: 20px; font-size: 12px; }
.menu-day { border-left: 4px solid var(--primary); padding: 12px; margin: 10px 0; background: #faf9ff; border-radius: 8px; }
.notice { padding: 13px; border-bottom: 1px solid #eee; }
footer { text-align: center; color: #88829a; padding: 18px; font-size: 12px; }
@media(max-width:700px) {
  .layout { display: block; }
  .sidebar { width: 100%; display: flex; overflow-x: auto; gap: 4px; padding: 8px; border-right: 0; border-bottom: 1px solid #eee; }
  .nav-btn { width: auto; white-space: nowrap; margin: 0; }
  main { padding: 14px; }
  .app-header { padding: 14px; }
  .profile-top { align-items: flex-start; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="loginPage" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🏠 HostelHub</div>
    <p class="muted">Your hostel, all in one place.</p>

    <form id="loginForm">
      <label for="loginUsername">Username</label>
      <input id="loginUsername" required autocomplete="username" placeholder="Enter username">

      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Enter password">

      <label for="loginRole">Login as</label>
      <select id="loginRole">
        <option value="student">Student</option>
        <option value="warden">Warden</option>
      </select>

      <button style="width:100%" type="submit">Login</button>
      <p id="loginMessage" class="error" role="status"></p>
    </form>

    <hr style="border:0;border-top:1px solid #eee;margin:20px 0">
    <h3>Create an account</h3>
    <form id="registerForm">
      <label for="regName">Full name</label>
      <input id="regName" required placeholder="Your full name">

      <label for="regUsername">Username</label>
      <input id="regUsername" required minlength="3" placeholder="Choose a username">

      <label for="regPassword">Password</label>
      <input id="regPassword" type="password" required minlength="4" placeholder="At least 4 characters">

      <label for="regRole">Account type</label>
      <select id="regRole">
        <option value="student">Student</option>
        <option value="warden">Warden</option>
      </select>

      <button class="secondary" style="width:100%" type="submit">Register</button>
      <p id="registerMessage" class="muted" role="status"></p>
    </form>

    <p class="muted">Demo student: student1 / 1234<br>Demo warden: warden1 / 1234</p>
  </div>
</section>

<!-- APP -->
<section id="appPage" class="hidden">
  <header class="app-header">
    <div class="brand">🏠 Hostel<span>Hub</span></div>
    <div class="header-user">
      <img id="headerPhoto" alt="Profile">
      <span id="headerName">User</span>
      <button id="logoutBtn" class="secondary">Logout</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <button class="nav-btn active" data-page="dashboard">🏠 Dashboard</button>
      <button class="nav-btn" data-page="profile">👤 My Profile</button>
      <button class="nav-btn" data-page="students" data-warden>👥 Students</button>
      <button class="nav-btn" data-page="notices">📢 Notices</button>
      <button class="nav-btn" data-page="menu">🍽️ Weekly Menu</button>
      <button class="nav-btn" data-page="complaints">📝 Complaints</button>
      <button class="nav-btn" data-page="fees">💳 Fees</button>
      <button class="nav-btn" data-page="gate">🕒 Gate Timings</button>
    </nav>

    <main><div class="page" id="pageContent"></div></main>
  </div>
  <footer>HostelHub · Hostel management made simple</footer>
</section>

<script>
"use strict";

const $ = id => document.getElementById(id);
const STORE = {
  accounts: "hostelhub_accounts_v1",
  profiles: "hostelhub_profiles_v1",
  students: "hostelhub_students_v1",
  notices: "hostelhub_notices_v1",
  menu: "hostelhub_menu_v1",
  complaints: "hostelhub_complaints_v1",
  fees: "hostelhub_fees_v1",
  gate: "hostelhub_gate_v1"
};

let currentUser = null;
let currentPage = "dashboard";
let pendingProfilePhoto = null;

function readStore(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value === null ? fallback : value;
  } catch {
    return fallback;
  }
}
function writeStore(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[ch]);
}
function getAccounts() { return readStore(STORE.accounts, []); }
function getProfiles() { return readStore(STORE.profiles, {}); }
function getProfile(username) {
  return getProfiles()[username] || { name: username, phone:"", email:"", photo:"", role:"student" };
}
function getPhoto(username) {
  return getProfile(username).photo || "https://placehold.co/120x120?text=Profile";
}
function seedDemoData() {
  let accounts = getAccounts();
  if (!accounts.some(a => a.username === "student1")) {
    accounts.push({ username:"student1", password:"1234", role:"student", name:"Demo Student" });
  }
  if (!accounts.some(a => a.username === "warden1")) {
    accounts.push({ username:"warden1", password:"1234", role:"warden", name:"Demo Warden" });
  }
  writeStore(STORE.accounts, accounts);

  const profiles = getProfiles();
  if (!profiles.student1) profiles.student1 = { name:"Demo Student", phone:"", email:"", photo:"", role:"student" };
  if (!profiles.warden1) profiles.warden1 = { name:"Demo Warden", phone:"", email:"", photo:"", role:"warden" };
  writeStore(STORE.profiles, profiles);

  if (!localStorage.getItem(STORE.students)) writeStore(STORE.students, [
    { username:"student1", name:"Demo Student", room:"101", phone:"", status:"Active" }
  ]);
  if (!localStorage.getItem(STORE.notices)) writeStore(STORE.notices, [
    { id:1, title:"Welcome to HostelHub", body:"Check the weekly food menu and hostel notices here.", date:new Date().toLocaleDateString() }
  ]);
  if (!localStorage.getItem(STORE.menu)) writeStore(STORE.menu, [
    { day:"Monday", breakfast:"Idli and sambar", lunch:"Rice, dal and vegetables", dinner:"Chapati and curry" },
    { day:"Tuesday", breakfast:"Dosa and chutney", lunch:"Rice and chicken curry", dinner:"Vegetable pulao" },
    { day:"Wednesday", breakfast:"Puttu and kadala", lunch:"Rice, sambar and vegetables", dinner:"Chapati and egg curry" },
    { day:"Thursday", breakfast:"Upma and banana", lunch:"Rice and fish curry", dinner:"Dosa and chutney" },
    { day:"Friday", breakfast:"Appam and stew", lunch:"Rice, dal and vegetables", dinner:"Fried rice" },
    { day:"Saturday", breakfast:"Poori and potato", lunch:"Rice and curry", dinner:"Chapati and paneer curry" },
    { day:"Sunday", breakfast:"Bread and omelette", lunch:"Special lunch", dinner:"Light dinner" }
  ]);
  if (!localStorage.getItem(STORE.complaints)) writeStore(STORE.complaints, []);
  if (!localStorage.getItem(STORE.fees)) writeStore(STORE.fees, []);
  if (!localStorage.getItem(STORE.gate)) writeStore(STORE.gate, { open:"06:00", close:"21:00", note:"Please return before closing time." });
}
seedDemoData();

$("loginForm").addEventListener("submit", event => {
  event.preventDefault();
  const username = $("loginUsername").value.trim();
  const password = $("loginPassword").value;
  const role = $("loginRole").value;
  const account = getAccounts().find(a => a.username.toLowerCase() === username.toLowerCase()
    && a.password === password && a.role === role);

  if (!account) {
    $("loginMessage").textContent = "Invalid username, password, or account type.";
    return;
  }
  loginAs(account);
});

$("registerForm").addEventListener("submit", event => {
  event.preventDefault();
  const name = $("regName").value.trim();
  const username = $("regUsername").value.trim();
  const password = $("regPassword").value;
  const role = $("regRole").value;
  const message = $("registerMessage");

  if (name.length < 2) { message.textContent = "Please enter your full name."; return; }
  if (!/^[a-zA-Z0-9_.-]{3,30}$/.test(username)) {
    message.textContent = "Username must be 3–30 characters (letters, numbers, _, . or -).";
    return;
  }
  if (password.length < 4) { message.textContent = "Password must contain at least 4 characters."; return; }

  const accounts = getAccounts();
  if (accounts.some(a => a.username.toLowerCase() === username.toLowerCase())) {
    message.textContent = "That username is already registered.";
    return;
  }

  accounts.push({ username, password, role, name });
  writeStore(STORE.accounts, accounts);

  const profiles = getProfiles();
  profiles[username] = { name, phone:"", email:"", photo:"", role };
  writeStore(STORE.profiles, profiles);

  if (role === "student") {
    const students = readStore(STORE.students, []);
    students.push({ username, name, room:"Not assigned", phone:"", status:"Active" });
    writeStore(STORE.students, students);
  }

  message.className = "success";
  message.textContent = "Account created. You can now log in.";
  $("loginUsername").value = username;
  $("loginRole").value = role;
});

function loginAs(account) {
  currentUser = { username:account.username, role:account.role };
  currentPage = "dashboard";
  $("loginPage").classList.add("hidden");
  $("appPage").classList.remove("hidden");
  document.querySelectorAll("[data-warden]").forEach(el => {
    el.classList.toggle("hidden", currentUser.role !== "warden");
  });
  updateHeader();
  renderPage("dashboard");
}

function updateHeader() {
  const profile = getProfile(currentUser.username);
  $("headerName").textContent = profile.name || currentUser.username;
  $("headerPhoto").src = getPhoto(currentUser.username);
}

$("logoutBtn").addEventListener("click", () => {
  currentUser = null;
  pendingProfilePhoto = null;
  $("appPage").classList.add("hidden");
  $("loginPage").classList.remove("hidden");
  $("loginForm").reset();
  $("loginMessage").textContent = "";
});

$("sidebar").addEventListener("click", event => {
  const button = event.target.closest("[data-page]");
  if (!button || button.classList.contains("hidden")) return;
  renderPage(button.dataset.page);
});

function renderPage(page) {
  if (!currentUser) return;
  if (page === "students" && currentUser.role !== "warden") page = "dashboard";
  currentPage = page;

  document.querySelectorAll(".nav-btn").forEach(btn =>
    btn.classList.toggle("active", btn.dataset.page === page)
  );

  const content = $("pageContent");
  const profile = getProfile(currentUser.username);

  if (page === "dashboard") {
    const studentCount = readStore(STORE.students, []).length;
    const noticeCount = readStore(STORE.notices, []).length;
    content.innerHTML = `
      <h1>Welcome, ${escapeHTML(profile.name || currentUser.username)}!</h1>
      <p class="muted">Here is your HostelHub overview.</p>
      <div class="grid">
        <div class="stat">Account type<strong>${escapeHTML(currentUser.role)}</strong></div>
        <div class="stat">Notices<strong>${noticeCount}</strong></div>
        ${currentUser.role === "warden" ? `<div class="stat">Students<strong>${studentCount}</strong></div>` : ""}
      </div>
      <div class="card" style="margin-top:18px">
        <h2>Quick Actions</h2>
        <div class="row">
          <button onclick="renderPage('profile')">Edit My Profile</button>
          <button class="secondary" onclick="renderPage('menu')">View Weekly Menu</button>
          <button class="secondary" onclick="renderPage('notices')">View Notices</button>
        </div>
      </div>
      <div class="card"><h2>Latest Notices</h2>${noticeListHTML(3)}</div>`;
  }

  if (page === "profile") {
    pendingProfilePhoto = profile.photo || "";
    content.innerHTML = `
      <h1>My Profile</h1>
      <div class="card">
        <div class="profile-top">
          <img class="profile-photo" id="profilePreview" src="${escapeHTML(pendingProfilePhoto || "https://placehold.co/120x120?text=Profile")}" alt="Profile picture">
          <div><h3>${escapeHTML(profile.name || currentUser.username)}</h3>
            <span class="badge">${escapeHTML(currentUser.role)}</span>
            <p class="muted">Update your personal information below.</p>
          </div>
        </div>
        <form id="profileForm">
          <label for="profilePhoto">Profile picture</label>
          <input id="profilePhoto" type="file" accept="image/*">
          <label for="profileName">Full name</label>
          <input id="profileName" required maxlength="80" value="${escapeHTML(profile.name || "")}">
          <label for="profilePhone">Phone number</label>
          <input id="profilePhone" type="tel" maxlength="20" value="${escapeHTML(profile.phone || "")}" placeholder="Enter phone number">
          <label for="profileEmail">Email address</label>
          <input id="profileEmail" type="email" maxlength="120" value="${escapeHTML(profile.email || "")}" placeholder="Enter email address">
          <label>Username</label>
          <input value="${escapeHTML(currentUser.username)}" readonly>
          <label>Account type</label>
          <input value="${escapeHTML(currentUser.role)}" readonly>
          <p id="profileMessage" role="status" class="muted"></p>
          <button type="submit">Save Changes</button>
          <button type="button" class="secondary" id="resetProfilePhoto">Restore Saved Picture</button>
        </form>
      </div>`;

    $("profilePhoto").addEventListener("change", handlePhotoChange);
    $("resetProfilePhoto").addEventListener("click", () => {
      pendingProfilePhoto = profile.photo || "";
      $("profilePreview").src = pendingProfilePhoto || "https://placehold.co/120x120?text=Profile";
      $("profilePhoto").value = "";
    });
    $("profileForm").addEventListener("submit", saveProfile);
  }

  if (page === "students") renderStudents(content);
  if (page === "notices") renderNotices(content);
  if (page === "menu") renderMenu(content);
  if (page === "complaints") renderComplaints(content);
  if (page === "fees") renderFees(content);
  if (page === "gate") renderGate(content);
}

function handlePhotoChange(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please choose a valid image file.");
    event.target.value = "";
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    alert("Please choose an image smaller than 2 MB.");
    event.target.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    pendingProfilePhoto = reader.result;
    $("profilePreview").src = reader.result;
  };
  reader.onerror = () => alert("Could not read that image.");
  reader.readAsDataURL(file);
}

function saveProfile(event) {
  event.preventDefault();
  const name = $("profileName").value.trim();
  const phone = $("profilePhone").value.trim();
  const email = $("profileEmail").value.trim();
  const message = $("profileMessage");

  if (name.length < 2) {
    message.className = "error";
    message.textContent = "Please enter a valid name.";
    return;
  }
  if (phone && !/^[+\d\s()-]{7,20}$/.test(phone)) {
    message.className = "error";
    message.textContent = "Please enter a valid phone number.";
    return;
  }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    message.className = "error";
    message.textContent = "Please enter a valid email address.";
    return;
  }

  const profiles = getProfiles();
  profiles[currentUser.username] = {
    ...getProfile(currentUser.username),
    name, phone, email,
    photo: pendingProfilePhoto || "",
    role: currentUser.role
  };

  try {
    writeStore(STORE.profiles, profiles);

    const accounts = getAccounts().map(a =>
      a.username === currentUser.username ? { ...a, name } : a
    );
    writeStore(STORE.accounts, accounts);

    const students = readStore(STORE.students, []).map(s =>
      s.username === currentUser.username ? { ...s, name, phone } : s
    );
    writeStore(STORE.students, students);

    updateHeader();
    message.className = "success";
    message.textContent = "Your profile has been saved successfully.";
    const heading = document.querySelector("#pageContent .profile-top h3");
    if (heading) heading.textContent = name;
  } catch {
    message.className = "error";
    message.textContent = "Could not save profile. Try a smaller image.";
  }
}

function renderStudents(content) {
  const students = readStore(STORE.students, []);
  content.innerHTML = `
    <h1>Student Management</h1>
    <div class="card">
      <h2>Add Student</h2>
      <form id="addStudentForm" class="grid">
        <div><label for="studentName">Student name</label><input id="studentName" required></div>
        <div><label for="studentUsername">Username (optional)</label><input id="studentUsername"></div>
        <div><label for="studentRoom">Room number</label><input id="studentRoom" required></div>
        <div><label for="studentPhone">Phone number</label><input id="studentPhone"></div>
        <div style="align-self:end"><button type="submit">Add Student</button></div>
      </form>
      <p id="studentMessage" class="muted"></p>
    </div>
    <div class="card"><h2>Registered Students (${students.length})</h2>
      <div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Room</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead>
      <tbody>${students.map((s,i)=>`<tr>
        <td>${escapeHTML(s.name)}</td><td>${escapeHTML(s.username || "—")}</td>
        <td>${escapeHTML(s.room)}</td><td>${escapeHTML(s.phone || "—")}</td>
        <td>${escapeHTML(s.status || "Active")}</td>
        <td><button class="danger" data-remove-student="${i}">Remove</button></td>
      </tr>`).join("") || `<tr><td colspan="6">No students yet.</td></tr>`}</tbody></table></div>
    </div>`;

  $("addStudentForm").addEventListener("submit", event => {
    event.preventDefault();
    const name = $("studentName").value.trim();
    const username = $("studentUsername").value.trim();
    const room = $("studentRoom").value.trim();
    const phone = $("studentPhone").value.trim();
    if (!name || !room) return;
    const list = readStore(STORE.students, []);
    list.push({ name, username, room, phone, status:"Active" });
    writeStore(STORE.students, list);
    renderPage("students");
  });

  content.querySelectorAll("[data-remove-student]").forEach(button => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.removeStudent);
      const list = readStore(STORE.students, []);
      if (!confirm("Remove this student from the list?")) return;
      list.splice(index, 1);
      writeStore(STORE.students, list);
      renderPage("students");
    });
  });
}

function noticeListHTML(limit = 100) {
  const notices = readStore(STORE.notices, []).slice().reverse().slice(0,limit);
  if (!notices.length) return `<p class="muted">No notices posted.</p>`;
  return notices.map(n => `<div class="notice"><strong>${escapeHTML(n.title)}</strong>
    <p>${escapeHTML(n.body)}</p><small class="muted">${escapeHTML(n.date || "")}</small></div>`).join("");
}

function renderNotices(content) {
  const warden = currentUser.role === "warden";
  content.innerHTML = `<h1>Notices</h1>
    ${warden ? `<div class="card"><h2>Post a Notice</h2>
      <form id="noticeForm"><label for="noticeTitle">Title</label><input id="noticeTitle" required maxlength="100">
      <label for="noticeBody">Message</label><textarea id="noticeBody" required maxlength="2000"></textarea>
      <button type="submit">Publish Notice</button></form></div>` : ""}
    <div class="card"><h2>Latest Updates</h2>${noticeListHTML()}</div>`;

  if (warden) $("noticeForm").addEventListener("submit", event => {
    event.preventDefault();
    const notices = readStore(STORE.notices, []);
    notices.push({
      id: Date.now(),
      title: $("noticeTitle").value.trim(),
      body: $("noticeBody").value.trim(),
      date: new Date().toLocaleString()
    });
    writeStore(STORE.notices, notices);
    renderPage("notices");
  });
}

function renderMenu(content) {
  const menu = readStore(STORE.menu, []);
  const warden = currentUser.role === "warden";
  content.innerHTML = `<h1>Weekly Food Menu</h1>
    ${warden ? `<div class="card"><h2>Edit Weekly Menu</h2>
      <form id="menuForm">
      ${menu.map((m,i)=>`<div class="menu-day"><h3>${escapeHTML(m.day)}</h3>
        <label for="breakfast${i}">Breakfast</label><input id="breakfast${i}" required maxlength="200" value="${escapeHTML(m.breakfast)}">
        <label for="lunch${i}">Lunch</label><input id="lunch${i}" required maxlength="200" value="${escapeHTML(m.lunch)}">
        <label for="dinner${i}">Dinner</label><input id="dinner${i}" required maxlength="200" value="${escapeHTML(m.dinner)}">
      </div>`).join("")}
      <button type="submit">Save Weekly Menu</button>
      </form></div>` : ""}
    <div class="card"><h2>This Week</h2>
      ${menu.map(m=>`<div class="menu-day"><h3>${escapeHTML(m.day)}</h3>
        <p><strong>Breakfast:</strong> ${escapeHTML(m.breakfast)}</p>
        <p><strong>Lunch:</strong> ${escapeHTML(m.lunch)}</p>
        <p><strong>Dinner:</strong> ${escapeHTML(m.dinner)}</p>
      </div>`).join("")}</div>`;

  if (warden) $("menuForm").addEventListener("submit", event => {
    event.preventDefault();
    const updated = menu.map((m,i)=>({
      day:m.day,
      breakfast:$("breakfast"+i).value.trim(),
      lunch:$("lunch"+i).value.trim(),
      dinner:$("dinner"+i).value.trim()
    }));
    writeStore(STORE.menu, updated);
    alert("Weekly menu saved.");
    renderPage("menu");
  });
}

function renderComplaints(content) {
  const complaints = readStore(STORE.complaints, []);
  const mine = complaints.filter(c => currentUser.role === "warden" || c.username === currentUser.username);
  content.innerHTML = `<h1>Complaints & Requests</h1>
    <div class="card"><h2>Submit a Complaint</h2>
      <form id="complaintForm"><label for="complaintTitle">Subject</label><input id="complaintTitle" required maxlength="100">
      <label for="complaintBody">Details</label><textarea id="complaintBody" required maxlength="2000"></textarea>
      <button type="submit">Submit Complaint</button></form></div>
    <div class="card"><h2>${currentUser.role === "warden" ? "All Complaints" : "My Complaints"}</h2>
    ${mine.map(c=>`<div class="notice"><strong>${escapeHTML(c.title)}</strong>
      <p>${escapeHTML(c.body)}</p><small class="muted">By ${escapeHTML(c.username)} · ${escapeHTML(c.date)}</small>
      <p>Status: <span class="badge">${escapeHTML(c.status)}</span></p>
      ${currentUser.role === "warden" ? `<button data-resolve="${c.id}">${c.status === "Resolved" ? "Reopen" : "Mark Resolved"}</button>` : ""}
    </div>`).join("") || `<p class="muted">No complaints found.</p>`}</div>`;

  $("complaintForm").addEventListener("submit", event => {
    event.preventDefault();
    const list = readStore(STORE.complaints, []);
    list.push({ id:Date.now(), username:currentUser.username, title:$("complaintTitle").value.trim(),
      body:$("complaintBody").value.trim(), date:new Date().toLocaleString(), status:"Open" });
    writeStore(STORE.complaints, list);
    renderPage("complaints");
  });

  content.querySelectorAll("[data-resolve]").forEach(button => button.addEventListener("click", () => {
    const id = Number(button.dataset.resolve);
    const list = readStore(STORE.complaints, []).map(c => c.id === id
      ? {...c, status:c.status === "Resolved" ? "Open" : "Resolved"} : c);
    writeStore(STORE.complaints, list);
    renderPage("complaints");
  }));
}

function renderFees(content) {
  let fees = readStore(STORE.fees, []);
  if (currentUser.role === "warden") {
    content.innerHTML = `<h1>Fee Management</h1>
      <div class="card"><h2>Add Fee Record</h2>
        <form id="feeForm" class="grid">
          <div><label for="feeUser">Student username</label><input id="feeUser" required></div>
          <div><label for="feeAmount">Amount</label><input id="feeAmount" type="number" min="0.01" step="0.01" required></div>
          <div><label for="feeDue">Due date</label><input id="feeDue" type="date" required></div>
          <div><label for="feeDescription">Description</label><input id="feeDescription" required></div>
          <div style="align-self:end"><button type="submit">Add Fee</button></div>
        </form></div>
      <div class="card"><h2>All Fee Records</h2>${feeTable(fees,true)}</div>`;

    $("feeForm").addEventListener("submit", event => {
      event.preventDefault();
      fees.push({ id:Date.now(), username:$("feeUser").value.trim(),
        amount:Number($("feeAmount").value), due:$("feeDue").value,
        description:$("feeDescription").value.trim(), status:"Unpaid" });
      writeStore(STORE.fees, fees);
      renderPage("fees");
    });

    content.querySelectorAll("[data-paid]").forEach(button => button.addEventListener("click", () => {
      const id = Number(button.dataset.paid);
      fees = readStore(STORE.fees, []).map(f => f.id === id
        ? {...f, status:f.status === "Paid" ? "Unpaid" : "Paid"} : f);
      writeStore(STORE.fees, fees);
      renderPage("fees");
    }));
  } else {
    fees = fees.filter(f => f.username === currentUser.username);
    content.innerHTML = `<h1>My Fees</h1><div class="card"><p class="muted">Contact your warden if you have questions about a fee record.</p>${feeTable(fees,false)}</div>`;
  }
}

function feeTable(fees, warden) {
  if (!fees.length) return `<p class="muted">No fee records found.</p>`;
  return `<div class="table-wrap"><table><thead><tr><th>Student</th><th>Description</th><th>Amount</th><th>Due date</th><th>Status</th>${warden?"<th>Action</th>":""}</tr></thead><tbody>
  ${fees.map(f=>`<tr><td>${escapeHTML(f.username)}</td><td>${escapeHTML(f.description)}</td><td>${Number(f.amount).toFixed(2)}</td><td>${escapeHTML(f.due)}</td><td>${escapeHTML(f.status)}</td>
  ${warden?`<td><button data-paid="${f.id}">${f.status==="Paid"?"Mark Unpaid":"Mark Paid"}</button></td>`:""}</tr>`).join("")}
  </tbody></table></div>`;
}

function renderGate(content) {
  const gate = readStore(STORE.gate, {open:"06:00",close:"21:00",note:"Please return before closing time."});
  const warden = currentUser.role === "warden";
  content.innerHTML = `<h1>Gate Timings</h1>
    <div class="card"><h2>Hostel Gate Schedule</h2>
      <div class="grid"><div class="stat">Opening Time<strong>${escapeHTML(gate.open)}</strong></div>
      <div class="stat">Closing Time<strong>${escapeHTML(gate.close)}</strong></div></div>
      <p>${escapeHTML(gate.note)}</p>
      ${warden?`<hr style="border:0;border-top:1px solid #eee;margin:20px 0">
        <h3>Edit Gate Timings</h3>
        <form id="gateForm"><label for="gateOpen">Opening time</label><input id="gateOpen" type="time" required value="${escapeHTML(gate.open)}">
        <label for="gateClose">Closing time</label><input id="gateClose" type="time" required value="${escapeHTML(gate.close)}">
        <label for="gateNote">Message</label><textarea id="gateNote" maxlength="500">${escapeHTML(gate.note)}</textarea>
        <button type="submit">Save Timings</button></form>`:""}
    </div>`;

  if (warden) $("gateForm").addEventListener("submit", event => {
    event.preventDefault();
    writeStore(STORE.gate, {open:$("gateOpen").value, close:$("gateClose").value, note:$("gateNote").value.trim()});
    renderPage("gate");
  });
}
</script>
</body>
</html>
