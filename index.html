


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4334d0">
<title>HostelHub - Smart Hostel Management</title>
<style>
:root{--p:#4935d5;--bg:#f0f3ff;--ink:#18234b;--muted:#707b96}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
header{background:linear-gradient(120deg,#3529c5,#4936d4);color:white;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:21px;font-weight:bold}
.brand small{display:block;font-size:11px;font-weight:normal;margin-top:4px}
main{max-width:1050px;margin:20px auto;padding:0 14px 30px}
.card{background:white;border:1px solid #e0e6f5;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 3px 12px #202d5909}
h2{font-size:20px;margin:0 0 14px}
h3{font-size:15px;margin:0 0 9px}
p{line-height:1.5}
.muted{color:var(--muted);font-size:13px}
.primary{background:var(--p);color:white;border-radius:11px;padding:12px 16px;font-weight:bold}
.secondary{background:#efedff;color:var(--p);border-radius:10px;padding:10px}
.danger{background:#fff0f0;color:#c33;border-radius:10px;padding:10px}
label{display:block;font-size:13px;font-weight:bold;margin-top:10px}
input,textarea,select{width:100%;padding:12px;border:1px solid #dfe4f3;border-radius:10px;margin:6px 0 10px;background:#fff}
.login{max-width:430px;margin:25px auto}
.center{text-align:center}
.logo{font-size:60px;color:var(--p);margin-bottom:4px}
.roles{display:flex;background:#f0f2ff;border-radius:24px;padding:3px;margin:20px 0}
.roles button{flex:1;padding:11px;border-radius:22px;background:transparent;color:var(--p)}
.roles .active{background:var(--p);color:white}
.hidden{display:none!important}
.hero{background:linear-gradient(120deg,#392bc5,#4935d5);color:white;border-radius:18px;padding:21px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.hero h2{font-size:22px;margin:7px 0}
.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#ddd6fe;border:2px solid white}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:white;border:1px solid #e1e7f5;border-radius:14px;padding:14px}
.stat strong{display:block;font-size:24px;margin:9px 0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:white;border:1px solid #e0e6f4;border-radius:14px;padding:17px 8px;min-height:92px;color:var(--ink)}
.tile span{display:block;font-size:27px;margin-bottom:8px}
.tile b{font-size:13px}
nav{display:flex;gap:5px;overflow-x:auto;background:white;padding:7px;border-radius:13px;margin-bottom:14px}
nav button{background:transparent;color:#6c7590;padding:10px;border-radius:10px;white-space:nowrap;font-size:12px}
nav button.active{background:#eeeaff;color:var(--p);font-weight:bold}
.item{background:#edf5ff;border:1px solid #e3edfa;border-radius:12px;padding:13px;margin:9px 0}
.badge{display:inline-block;background:#e4f8e9;color:#258548;border-radius:20px;padding:5px 9px;font-size:11px}
.pending{background:#fff0d6;color:#9b6800}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{text-align:left;padding:10px 7px;border-bottom:1px solid #e8eaf4}
.tablewrap{overflow-x:auto}
.notice{padding:12px;border-radius:12px;background:#fff5d9;color:#775800;font-size:13px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
@media(max-width:600px){
 body{padding-bottom:72px}
 header{padding:12px 16px}
 .brand{font-size:19px}.brand small{display:none}
 main{margin:0 auto;padding:10px 12px 20px;max-width:480px}
 .hero{margin:-10px -12px 13px;border-radius:0 0 16px 16px;padding:21px 16px}
 .hero h2{font-size:20px}
 .card{padding:14px;border-radius:14px}
 #navigation{position:fixed;z-index:10;bottom:0;left:0;right:0;border-radius:14px 14px 0 0;margin:0;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -3px 14px #18234b15}
 #navigation button{flex:1;padding:8px 4px;font-size:10px}
 #navigation button.active{background:transparent;color:var(--p)}
 .login{margin:12px auto}
}
</style>
</head>
<body>
<header>
 <div class="brand">🏠 HostelHub<small>Smart Hostel Management</small></div>
 <button id="logoutTop" class="secondary hidden" onclick="logout()">Logout</button>
</header>
<main>
<section id="loginPage" class="login">
 <div class="card center">
  <div class="logo">⌂</div>
  <h2 style="font-size:29px;color:#4030be">HostelHub</h2>
  <p class="muted">Smart Hostel Management</p>
  <div class="roles">
   <button id="studentRole" class="active" onclick="setRole('student')">Student</button>
   <button id="wardenRole" onclick="setRole('warden')">Warden</button>
  </div>
  <div id="loginArea">
   <form onsubmit="login(event)">
    <label>User ID</label><input id="userId" required autocomplete="username" placeholder="Enter your user ID">
    <label>Password</label><input id="password" required type="password" autocomplete="current-password" placeholder="Enter password">
    <button class="primary" style="width:100%">Login</button>
   </form>
   <button class="secondary" style="width:100%;margin-top:12px" onclick="showRegister()">Create Account</button>
  </div>
  <div id="registerArea" class="hidden">
   <h3>Create Account</h3>
   <form onsubmit="registerAccount(event)">
    <label>Full Name</label><input id="regName" required>
    <label>User ID</label><input id="regId" required minlength="4" pattern="[A-Za-z0-9_-]+" title="Use letters, numbers, underscores or hyphens">
    <label>Password</label><input id="regPassword" type="password" required minlength="6">
    <div id="studentFields">
     <label>Course</label><input id="regCourse" required>
     <label>Semester</label><input id="regYear">
     <label>Room Number</label><input id="regRoom" required>
     <label>Block</label><input id="regBlock" value="A" required>
     <label>Phone</label><input id="regPhone" type="tel">
    </div>
    <button class="primary" style="width:100%">Register</button>
   </form>
   <button class="secondary" style="width:100%;margin-top:10px" onclick="showLogin()">Back to Login</button>
  </div>
  <p id="loginError" class="muted"></p>
 </div>
</section>

<section id="appPage" class="hidden">
 <div class="hero">
  <div><small>WELCOME TO HOSTELHUB</small><h2 id="welcome">Hello!</h2><small id="welcomeSub">Your hostel, all in one place</small></div>
  <img id="heroAvatar" class="avatar" alt="Profile">
 </div>
 <nav id="navigation"></nav>
 <div id="view"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};
const store=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let students=load('hh_students',[
{id:'student1',name:'Rahul',course:'BCA',year:'3rd Semester',room:'204',block:'B',phone:'9876543210',status:'Inside',fees:21900},
{id:'student2',name:'Anjali',course:'BCA',year:'3rd Semester',room:'205',block:'B',phone:'9876501234',status:'Inside',fees:15000},
{id:'student3',name:'Arjun',course:'BBA',year:'2nd Semester',room:'108',block:'A',phone:'9876512340',status:'Outside',fees:0}
]);
let accounts=load('hh_accounts',[]);
let notices=load('hh_notices',[
{title:'Freshers Day Celebration',type:'Important',date:'16 Sep 2026',body:'B.Tech / BBA / BCA students: check the event schedule.'},
{title:'YIP Competition',type:'Notice',date:'16 Sep 2026',body:'All students are requested to register and submit their ideas.'},
{title:'Hostel Maintenance',type:'General',date:'12 Sep 2026',body:'Water supply maintenance. Please follow the warden instructions.'},
{title:'Fee Payment',type:'Reminder',date:'10 Sep 2026',body:'Kindly clear pending fees before the due date.'}
]);
let complaints=load('hh_complaints',[
{name:'Rahul',room:'204',text:'Fan not working in room',status:'Pending',date:'10 Sep 2026'},
{name:'Anjali',room:'205',text:'Poor food quality',status:'Resolved',date:'08 Sep 2026'},
{name:'Rahul',room:'204',text:'Water leakage',status:'Resolved',date:'05 Sep 2026'}
]);
let menu=load('hh_menu',[
'Rice, Sambar, Cabbage Thoran','Chapati, Vegetable Curry, Salad',
'Rice, Chicken Curry, Kanji','Rice, Dal, Mixed Vegetables',
'Biriyani, Raita','Meals, Fish Curry','Special Menu'
]);
let fees=load('hh_fees',{1:69500,2:54400,3:21900});
let logs=load('hh_logs',[]);
let role='student',current=null,tab='Home';

function save(){
 store('hh_students',students);store('hh_notices',notices);
 store('hh_complaints',complaints);store('hh_menu',menu);
 store('hh_fees',fees);store('hh_logs',logs);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setRole(r){
 role=r;
 $('studentRole').classList.toggle('active',r==='student');
 $('wardenRole').classList.toggle('active',r==='warden');
 $('studentFields').classList.toggle('hidden',r!=='student');
 $('loginError').textContent='';
}
function showRegister(){$('loginArea').classList.add('hidden');$('registerArea').classList.remove('hidden');$('studentFields').classList.toggle('hidden',role!=='student')}
function showLogin(){$('registerArea').classList.add('hidden');$('loginArea').classList.remove('hidden')}
function registerAccount(e){
 e.preventDefault();
 const id=$('regId').value.trim(),name=$('regName').value.trim(),password=$('regPassword').value;
 if(id.length<4||password.length<6){$('loginError').textContent='Use a user ID with 4+ characters and password with 6+ characters.';return}
 if(id.toLowerCase()==='warden1'||students.some(s=>s.id.toLowerCase()===id.toLowerCase())||accounts.some(a=>a.id.toLowerCase()===id.toLowerCase())){$('loginError').textContent='That user ID already exists.';return}
 const a={id,name,password,type:role};
 if(role==='student'){
  const s={id,name,course:$('regCourse').value.trim(),year:$('regYear').value.trim(),room:$('regRoom').value.trim(),block:$('regBlock').value.trim(),phone:$('regPhone').value.trim(),status:'Inside',fees:0};
  if(!s.course||!s.room||!s.block){$('loginError').textContent='Enter course, room and block.';return}
  students.push(s);
 }
 accounts.push(a);save();store('hh_accounts',accounts);
 e.target.reset();showLogin();$('userId').value=id;$('password').value=password;
 $('loginError').textContent='Account created. You can now log in.';
}
function login(e){
 e.preventDefault();
 const id=$('userId').value.trim(),password=$('password').value;
 let a=accounts.find(x=>x.id.toLowerCase()===id.toLowerCase()&&x.password===password&&x.type===role);
 // Demo warden account: warden1 / 1234
 if(!a&&role==='warden'&&id==='warden1'&&password==='1234')a={id,name:'Mr. R. Sharma',type:'warden'};
 if(!a&&role==='student'&&password==='1234'){
  const s=students.find(x=>x.id===id);if(s)a={...s,type:'student'};
 }
 if(!a){$('loginError').textContent='Incorrect ID, password or account type.';return}
 if(a.type==='student'&&!students.some(s=>s.id===a.id))students.push({...a,status:'Inside',fees:0});
 current={...a};if(current.type==='student')recordLog(current.id,'Login');
 $('loginPage').classList.add('hidden');$('appPage').classList.remove('hidden');$('logoutTop').classList.remove('hidden');
 tab='Home';render();
}
function logout(){
 if(current?.type==='student')recordLog(current.id,'Logout');
 current=null;$('loginPage').classList.remove('hidden');$('appPage').classList.add('hidden');$('logoutTop').classList.add('hidden');$('password').value='';showLogin();
}
function recordLog(id,event){logs.unshift({id,event,time:new Date().toLocaleString()});save()}
function getStudent(){return students.find(s=>s.id===current?.id)}
function avatar(name){return 'https://ui-avatars.com/api/?name='+encodeURIComponent(name||'User')+'&background=ddd6fe&color=4935d5&size=128'}
function navItems(){return current.type==='warden'?
[['Home','⌂'],['Students','♙'],['Entry/Exit','🚪'],['Notices','♢'],['Food Menu','🍴'],['Complaints','☏'],['Fees','▣'],['Profile','☺']]:
[['Home','⌂'],['Food Menu','🍴'],['Notices','♢'],['Complaints','☏'],['Fees','▣'],['Gate Timings','🚪'],['Profile','☺']]}
function render(){
 $('welcome').textContent='Welcome, '+current.name;
 $('welcomeSub').textContent=current.type==='warden'?'Warden':'Student';
 $('heroAvatar').src=current.photo||avatar(current.name);
 $('navigation').innerHTML=navItems().map(([n,i])=>`<button class="${n===tab?'active':''}" onclick="go('${n}')">${i} ${n}</button>`).join('');
 renderView();
}
function go(t){tab=t;render()}
function tile(name,icon){return `<button class="tile" onclick="go('${name}')"><span>${icon}</span><b>${name}</b></button>`}
function stat(icon,label,n){return `<div class="stat"><span style="font-size:25px">${icon}</span><strong>${n}</strong><small class="muted">${label}</small></div>`}
function renderView(){
 let v=$('view');
 if(tab==='Home'){
  if(current.type==='warden'){
   v.innerHTML=`<div class="stats">${stat('👥','Total Students',students.length)}${stat('🟢','Inside Hostel',students.filter(s=>s.status==='Inside').length)}${stat('🚶','Outside Hostel',students.filter(s=>s.status==='Outside').length)}${stat('💬','Pending Complaints',complaints.filter(c=>c.status==='Pending').length)}</div><div class="card"><h2>Quick Actions</h2><div class="tiles">${tile('Notices','📢')}${tile('Food Menu','🍴')}${tile('Fees','💳')}${tile('Complaints','💬')}${tile('Students','👥')}${tile('Entry/Exit','🚪')}</div></div><div class="card"><h2>Latest Announcements</h2>${noticeList(3)}</div>`;
  }else{
   let s=getStudent()||current;
   v.innerHTML=`<div class="card"><h3>🏢 Sunrise Hostel</h3><p>Block ${esc(s.block)} · Room ${esc(s.room)}</p><p class="muted">Gate Timings: 06:00 AM – 09:30 PM</p><span class="badge">${esc(s.status||'Inside')} Hostel</span></div><div class="card"><h2>Quick Actions</h2><div class="tiles">${tile('Food Menu','🍴')}${tile('Notices','📢')}${tile('Complaints','💬')}${tile('Fees','💳')}</div></div><div class="card"><h2>Today's Menu</h2><p>${esc(menu[(new Date().getDay()+6)%7])}</p></div><div class="card"><h2>Latest Announcements</h2>${noticeList(3)}</div>`;
  }
 }else if(tab==='Students')v.innerHTML=studentPage();
 else if(tab==='Entry/Exit')v.innerHTML=entryPage();
 else if(tab==='Notices')v.innerHTML=noticePage();
 else if(tab==='Food Menu')v.innerHTML=menuPage();
 else if(tab==='Complaints')v.innerHTML=complaintPage();
 else if(tab==='Fees')v.innerHTML=feesPage();
 else if(tab==='Gate Timings')v.innerHTML=gatePage();
 else if(tab==='Profile')v.innerHTML=profilePage();
}
function noticeList(n){return notices.slice(0,n).map(a=>`<div class="item"><span class="badge">${esc(a.type)}</span><h3 style="margin-top:10px">${esc(a.title)}</h3><small class="muted">${esc(a.date)}</small><p>${esc(a.body)}</p></div>`).join('')||'<p class="muted">No announcements.</p>'}
function noticePage(){return `<div class="card"><h2>📢 Announcements</h2>${current.type==='warden'?`<form onsubmit="addNotice(event)"><label>Title</label><input id="ntitle" required><label>Category</label><select id="ntype"><option>Important</option><option>Notice</option><option>General</option><option>Reminder</option></select><label>Message</label><textarea id="nbody" required></textarea><button class="primary">Publish Notice</button></form>`:''}${noticeList(100)}</div>`}
function addNotice(e){e.preventDefault();notices.unshift({title:$('ntitle').value.trim(),type:$('ntype').value,date:new Date().toLocaleDateString(),body:$('nbody').value.trim()});save();render()}
function studentPage(){return `<div class="card"><h2>👥 Student Management</h2><input id="searchStudent" placeholder="Search students..." oninput="filterStudents()"><button class="primary" onclick="addStudentForm()">＋ Add Student</button><div id="studentForm"></div><div id="studentRows">${studentRows(students)}</div></div>`}
function studentRows(list){return list.map(s=>`<div class="item"><h3>${esc(s.name)} (${esc(s.id)})</h3><p class="muted">${esc(s.course)} · ${esc(s.year)}</p><p>Block ${esc(s.block)}, Room ${esc(s.room)}</p><p>Phone: ${esc(s.phone)}</p><span class="badge ${s.status==='Outside'?'pending':''}">${esc(s.status)}</span> <button class="secondary" onclick="studentDetails('${esc(s.id)}')">Details</button></div>`).join('')||'<p>No students found.</p>'}
function filterStudents(){let q=$('searchStudent').value.toLowerCase();$('studentRows').innerHTML=studentRows(students.filter(s=>(s.name+' '+s.id+' '+s.room).toLowerCase().includes(q)))}
function addStudentForm(){$('studentForm').innerHTML=`<form class="item" onsubmit="addStudent(event)"><label>ID</label><input id="sid" required><label>Name</label><input id="sname" required><label>Course</label><input id="scourse" required><label>Semester</label><input id="syear"><label>Room</label><input id="sroom" required><label>Block</label><input id="sblock" required value="A"><label>Phone</label><input id="sphone"><label>Login Password</label><input id="spass" type="password" minlength="6" required><button class="primary">Save Student</button></form>`}
function addStudent(e){
 e.preventDefault();let id=$('sid').value.trim();
 if(students.some(s=>s.id.toLowerCase()===id.toLowerCase())||accounts.some(a=>a.id.toLowerCase()===id.toLowerCase())){alert('Student ID already exists.');return}
 let s={id,name:$('sname').value.trim(),course:$('scourse').value.trim(),year:$('syear').value.trim(),room:$('sroom').value.trim(),block:$('sblock').value.trim(),phone:$('sphone').value.trim(),status:'Inside',fees:0};
 students.push(s);accounts.push({id,name:s.name,password:$('spass').value,type:'student'});store('hh_accounts',accounts);save();render();
}
function studentDetails(id){let s=students.find(x=>x.id===id);if(s)alert(`Name: ${s.name}\nID: ${s.id}\nCourse: ${s.course}\nRoom: ${s.room}\nBlock: ${s.block}\nPhone: ${s.phone}\nStatus: ${s.status}\nPending fees: ₹${s.fees}`)}
function entryPage(){return `<div class="card"><h2>🚪 Entry / Exit Register</h2>${current.type==='warden'?`<form onsubmit="recordEntry(event)"><label>Student</label><select id="logStudent">${students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.id)})</option>`).join('')}</select><label>Activity</label><select id="logType"><option>Entry</option><option>Exit</option></select><button class="primary">Record Activity</button></form>`:''}<h3>Student Status</h3><div class="tablewrap"><table><tr><th>Student</th><th>Room</th><th>Status</th></tr>${students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.room)}</td><td>${esc(s.status)}</td></tr>`).join('')}</table></div><h3 style="margin-top:20px">Recent Activity</h3>${logs.slice(0,50).map(l=>`<div class="item">${esc(l.id)} — ${esc(l.event)}<p class="muted">${esc(l.time)}</p></div>`).join('')||'<p class="muted">No activity yet.</p>'}</div>`}
function recordEntry(e){e.preventDefault();let s=students.find(x=>x.id===$('logStudent').value),event=$('logType').value;if(!s)return;s.status=event==='Entry'?'Inside':'Outside';recordLog(s.id,event);render()}
function menuPage(){return `<div class="card"><h2>🍴 Weekly Food Menu</h2>${current.type==='warden'?'<form onsubmit="saveMenu(event)">':''}${menu.map((m,i)=>`<div class="item"><h3>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]}</h3>${current.type==='warden'?`<input id="meal${i}" value="${esc(m)}" required>`:`<p>${esc(m)}</p>`}</div>`).join('')}${current.type==='warden'?'<button class="primary">Save Menu</button></form>':''}</div>`}
function saveMenu(e){e.preventDefault();menu=menu.map((m,i)=>$('meal'+i).value.trim());save();alert('Weekly menu saved successfully!');render()}
function complaintPage(){return `<div class="card"><h2>💬 Complaints</h2>${current.type==='student'?`<form onsubmit="addComplaint(event)"><label>Describe your complaint</label><textarea id="complaintText" required maxlength="500" placeholder="Describe the problem..."></textarea><button class="primary">Submit Complaint</button></form>`:''}<h3>My Complaints / All Complaints</h3>${complaints.filter(c=>current.type==='warden'||c.name===current.name).map((c,i)=>`<div class="item"><h3>${esc(c.text)}</h3><p class="muted">${esc(c.name)} · Room ${esc(c.room)} · ${esc(c.date)}</p><span class="badge ${c.status==='Pending'?'pending':''}">${esc(c.status)}</span>${current.type==='warden'&&c.status==='Pending'?` <button class="secondary" onclick="resolveComplaint(${i})">Mark Resolved</button>`:''}</div>`).join('')||'<p class="muted">No complaints yet.</p>'}</div>`}
function addComplaint(e){e.preventDefault();let s=getStudent();complaints.unshift({name:current.name,room:s?.room||'',text:$('complaintText').value.trim(),status:'Pending',date:new Date().toLocaleDateString()});save();alert('Complaint submitted successfully.');render()}
function resolveComplaint(i){complaints[i].status='Resolved';save();render()}
function feesPage(){let s=current.type==='student'?getStudent():null;return `<div class="card"><h2>💳 Hostel Fees</h2>${s?`<div class="item"><h3>${esc(s.name)}</h3><p>Pending amount</p><h2>₹${Number(s.fees).toLocaleString('en-IN')}</h2></div>`:''}${[1,2,3].map(i=>`<div class="item">Semester ${i}<strong style="float:right">₹${Number(fees[i]).toLocaleString('en-IN')}</strong></div>`).join('')}${current.type==='warden'?`<form onsubmit="updateFees(event)"><h3>Update Fee Information</h3><label>Semester</label><select id="feeTerm"><option value="1">Semester 1</option><option value="2">Semester 2</option><option value="3">Semester 3</option></select><label>Amount (₹)</label><input id="feeAmount" type="number" min="0" required><button class="primary">Save Fee</button></form><h3>Student Fee Status</h3>${students.map(st=>`<div class="item">${esc(st.name)} — ₹${st.fees}<button class="secondary" onclick="markPaid('${esc(st.id)}')">Mark Paid</button></div>`).join('')}`:'<div class="notice">Payments are not processed in this demo.</div>'}</div>`}
function updateFees(e){e.preventDefault();fees[$('feeTerm').value]=Number($('feeAmount').value);save();render()}
function markPaid(id){let s=students.find(x=>x.id===id);if(s){s.fees=0;save();render()}}
function gatePage(){return `<div class="card"><h2>🚪 Gate Timings</h2><div class="item center"><div style="font-size:38px">🕕</div><h2>06:00 AM – 09:30 PM</h2><span class="badge">Regular Timings</span></div><h3>Important Points</h3><div class="item">• Students must carry their ID card.</div><div class="item">• After 9:30 PM, follow hostel rules and get permission for late entry.</div><div class="item">• Contact the warden in emergencies.</div><p class="muted">Confirm actual timings with your hostel.</p></div>`}
function profilePage(){let s=getStudent();return `<div class="card"><h2>👤 My Profile</h2><h3>${esc(current.name)}</h3><p class="muted">${current.type==='warden'?'Hostel Warden':esc(current.id)}</p>${s?`<div class="item"><p>Course: ${esc(s.course)}</p><p>Semester: ${esc(s.year)}</p><p>Room: ${esc(s.room)} · Block ${esc(s.block)}</p><p>Phone: ${esc(s.phone)}</p></div>`:''}<form onsubmit="updateProfile(event)"><label>Full Name</label><input id="editName" value="${esc(current.name)}" required>${s?`<label>Phone Number</label><input id="editPhone" value="${esc(s.phone)}">`:''}<button class="primary">Save Profile</button></form><button class="danger" onclick="logout()">Logout</button></div>`}
function updateProfile(e){e.preventDefault();let name=$('editName').value.trim();current.name=name;let a=accounts.find(x=>x.id===current.id);if(a){a.name=name;store('hh_accounts',accounts)}let s=getStudent();if(s){s.name=name;s.phone=$('editPhone').value.trim()}save();render();alert('Profile updated!')}
</script>
</body>
</html>
