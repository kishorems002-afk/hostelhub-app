
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4938df">
<title>HostelHub - Smart Hostel Management</title>
<style>
:root{--purple:#4935d5;--blue:#3977f6;--bg:#f4f6ff;--text:#20244a;--muted:#727a98;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
header{background:linear-gradient(120deg,#3024b9,#7254f6,#4789fa);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 5px 20px #3024b930}
.brand{font-size:24px;font-weight:800}.brand small{display:block;font-size:12px;font-weight:400;margin-top:5px}
main{max-width:1150px;margin:24px auto;padding:0 15px 35px}.card{background:var(--card);padding:19px;border-radius:20px;box-shadow:0 5px 22px #33314c0a;border:1px solid #e8eaff;margin-bottom:16px}
h2,h3,p{margin-top:0}h2{font-size:22px}.muted{color:var(--muted);font-size:13px;line-height:1.6}
.primary{background:linear-gradient(100deg,#4935d5,#7653f6);color:white;padding:12px 17px;border-radius:12px;font-weight:bold}
.secondary{background:#efedff;color:var(--purple);padding:10px 14px;border-radius:10px}.danger{background:#fff0f0;color:#c93f52;padding:9px 12px;border-radius:10px}
input,textarea,select{width:100%;padding:13px;border:1px solid #e0e4f4;border-radius:11px;background:#fbfcff;margin:6px 0 12px;outline-color:#7461ef}
label{font-size:13px;font-weight:600;display:block}.login-wrap{max-width:470px;margin:38px auto}.logo{width:76px;height:76px;border-radius:25px;margin:0 auto 12px;background:linear-gradient(140deg,#4831d4,#8764ff);display:grid;place-items:center;color:white;font-size:40px}
.center{text-align:center}.role-switch{display:flex;gap:8px;margin:20px 0}.role-switch button{flex:1;padding:12px;border-radius:12px;background:#f0efff;color:#5544b8}.role-switch button.active{background:var(--purple);color:white}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{padding:17px;border-radius:17px;background:white;border:1px solid #e7e9f6}.stat .emoji{font-size:25px}.stat strong{display:block;font-size:24px;margin:10px 0 4px}.stat small{color:var(--muted)}
.hero{background:linear-gradient(120deg,#4432cb,#7455f5,#4589f6);color:white;border-radius:23px;padding:25px;display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#e9e4ff;border:3px solid #ffffffa0}.profile-row{display:flex;align-items:center;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{background:white;border:1px solid #e7e7fb;border-radius:18px;padding:19px 10px;text-align:center;color:var(--text);box-shadow:0 4px 14px #34316b08}.tile span{display:block;font-size:30px;margin-bottom:12px}.tile b{font-size:13px}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;background:white;padding:9px;border-radius:16px}nav button{background:transparent;padding:11px 13px;border-radius:10px;color:#646b8b}nav button.active{background:#ece9ff;color:var(--purple);font-weight:bold}
.item{background:#fafaff;border:1px solid #ececf8;border-radius:13px;padding:14px;margin:10px 0}.item h3{font-size:15px;margin-bottom:7px}
.badge{display:inline-block;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:bold;background:#e6f9eb;color:#248b50}.badge.orange{background:#fff1d9;color:#a96900}.badge.blue{background:#e5edff;color:#315fd0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #ececf6}th{color:var(--muted)}.table-wrap{overflow-x:auto}.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}.notice{padding:12px;border-radius:12px;background:#fff5d9;color:#775800;font-size:13px;line-height:1.6}
@media(min-width:800px){.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}}
@media(max-width:650px){header{padding:15px}.brand{font-size:21px}main{margin-top:15px;padding:0 12px 25px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:19px}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}nav button{padding:11px 4px;font-size:12px}}
</style>
</head>
<body>
<header>
 <div class="brand">🏠 HostelHub<small>Smart Hostel Management</small></div>
 <button id="logoutTop" class="secondary hidden" onclick="logout()">↪ Logout</button>
</header>
<main>
<section id="loginPage" class="login-wrap">
 <div class="card center">
  <div class="logo">🏠</div>
  <h2 style="font-size:29px;color:#4030be;margin-bottom:5px">HostelHub</h2>
  <p class="muted">Stay Connected · Stay Informed · Stay Comfortable</p>
  <div class="role-switch">
   <button id="studentRole" class="active" onclick="setRole('student')">👨‍🎓 Student</button>
   <button id="wardenRole" onclick="setRole('warden')">🛡️ Warden</button>
  </div>
  <div id="loginFormArea">
   <form onsubmit="login(event)">
    <label>User ID</label><input id="userId" required placeholder="Enter your user ID" autocomplete="username">
    <label>Password</label><input id="password" required type="password" placeholder="Enter password" autocomplete="current-password">
    <button class="primary" style="width:100%">Login →</button>
   </form>
   <button type="button" class="secondary" style="width:100%;margin-top:12px" onclick="showRegister()">＋ Create New Account</button>
  </div>
  <div id="registerFormArea" class="hidden">
   <h3>Create Account</h3>
   <form onsubmit="registerAccount(event)">
    <label>Full Name</label><input id="regName" required placeholder="Enter full name">
    <label>Choose User ID</label><input id="regId" required minlength="4" placeholder="e.g. student5">
    <label>Create Password</label><input id="regPassword" type="password" required minlength="4" placeholder="At least 4 characters">
    <label>Profile Picture (optional)</label><input id="regPhoto" type="file" accept="image/jpeg,image/png,image/webp">
    <div id="studentRegisterFields">
     <label>Course</label><input id="regCourse" placeholder="BCA">
     <label>Semester</label><input id="regYear" placeholder="1st Semester">
     <label>Room Number</label><input id="regRoom" placeholder="206">
     <label>Block</label><input id="regBlock" value="A">
     <label>Phone Number</label><input id="regPhone" type="tel" placeholder="Phone number">
    </div>
    <button class="primary" style="width:100%">Register Account</button>
   </form>
   <button type="button" class="secondary" style="width:100%;margin-top:10px" onclick="showLogin()">Back to Login</button>
  </div>
  <p id="loginError" style="color:#d13e51;font-size:13px;margin-top:12px"></p>
 </div>
</section>
<section id="appPage" class="hidden">
 <div class="hero">
  <div><p style="margin-bottom:8px">WELCOME TO HOSTELHUB ✨</p><h2 id="welcome">Hello!</h2><p id="welcomeSub" style="margin-bottom:0;font-size:13px">Your hostel, all in one place.</p></div>
  <img id="heroAvatar" class="avatar" alt="Profile photo">
 </div>
 <nav id="navigation"></nav><div id="view"></div>
</section>
</main>
<footer>HostelHub © 2026 · Smart Hostel Management Working Model</footer>
<script>
const initialStudents=[
{id:'student1',name:'Rahul',course:'BCA',year:'3rd Semester',room:'204',block:'B',phone:'9876543210',photo:'',status:'Inside',fees:21900},
{id:'student2',name:'Anjali',course:'BCA',year:'3rd Semester',room:'205',block:'B',phone:'9876501234',photo:'',status:'Inside',fees:15000},
{id:'student3',name:'Arjun',course:'BBA',year:'2nd Semester',room:'108',block:'A',phone:'9876512340',photo:'',status:'Outside',fees:0},
{id:'student4',name:'Meera',course:'BTech',year:'3rd Semester',room:'302',block:'C',phone:'9876523450',photo:'',status:'Inside',fees:12000}
];
const read=(key,fallback)=>{try{const value=localStorage.getItem(key);return value?JSON.parse(value):fallback}catch(e){return fallback}};
let students=read('hh_students',initialStudents);
let accounts=read('hh_accounts',[]);
let notices=read('hh_notices',[
{title:'Freshers Day Celebration',type:'Important',date:'16 Sep 2026',body:'Please check the college schedule and follow the instructions.'},
{title:'YIP Competition',type:'Notice',date:'16 Sep 2026',body:'Students are encouraged to register and submit their ideas.'},
{title:'Hostel Maintenance',type:'General',date:'12 Sep 2026',body:'Please follow hostel maintenance announcements.'}
]);
let complaints=read('hh_complaints',[{name:'Rahul',room:'204',text:'Fan not working in room',status:'Pending',date:'10 Sep 2026'}]);
let logs=read('hh_logs',[]);
let menu=read('hh_menu',['Rice, Sambar, Cabbage Thoran','Chapati, Vegetable Curry, Salad','Rice, Chicken Curry, Kanji','Rice, Dal, Mixed Vegetables','Biriyani, Raita','Meals, Fish Curry','Special Menu']);
let fees=read('hh_fees',{1:69500,2:54400,3:21900});
let role='student',current=null,tab='Home';

function save(){
 localStorage.setItem('hh_students',JSON.stringify(students));
 localStorage.setItem('hh_notices',JSON.stringify(notices));
 localStorage.setItem('hh_complaints',JSON.stringify(complaints));
 localStorage.setItem('hh_logs',JSON.stringify(logs));
 localStorage.setItem('hh_menu',JSON.stringify(menu));
 localStorage.setItem('hh_fees',JSON.stringify(fees));
}
function saveAccounts(){localStorage.setItem('hh_accounts',JSON.stringify(accounts))}
function escapeHTML(s){
 return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}
function setRole(r){
 role=r;
 document.getElementById('studentRole').classList.toggle('active',r==='student');
 document.getElementById('wardenRole').classList.toggle('active',r==='warden');
 document.getElementById('loginError').textContent='';
 document.getElementById('studentRegisterFields').classList.toggle('hidden',r!=='student');
}
function showRegister(){
 document.getElementById('loginFormArea').classList.add('hidden');
 document.getElementById('registerFormArea').classList.remove('hidden');
 document.getElementById('studentRegisterFields').classList.toggle('hidden',role!=='student');
 document.getElementById('loginError').textContent='';
}
function showLogin(){
 document.getElementById('registerFormArea').classList.add('hidden');
 document.getElementById('loginFormArea').classList.remove('hidden');
}
function readPhoto(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve('');return}
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){reject(new Error('Choose a JPG, PNG or WebP image.'));return}
  if(file.size>2*1024*1024){reject(new Error('Profile picture must be 2 MB or smaller.'));return}
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(new Error('Could not read image.'));
  reader.readAsDataURL(file);
 });
}
async function registerAccount(e){
 e.preventDefault();
 const name=document.getElementById('regName').value.trim();
 const id=document.getElementById('regId').value.trim();
 const password=document.getElementById('regPassword').value;
 const error=document.getElementById('loginError');
 error.style.color='#d13e51';error.textContent='';
 if(!/^[a-zA-Z0-9_-]{4,30}$/.test(id)){error.textContent='User ID must be 4–30 characters using letters, numbers, _ or -.';return}
 if(students.some(s=>s.id.toLowerCase()===id.toLowerCase())||accounts.some(a=>a.id.toLowerCase()===id.toLowerCase())||id.toLowerCase()==='warden1'){error.textContent='This User ID is already taken.';return}
 if(password.length<4){error.textContent='Password must contain at least 4 characters.';return}
 try{
  const file=document.getElementById('regPhoto').files[0];
  const uploadedPhoto=await readPhoto(file);
  const account={id,name,password,type:role,photo:uploadedPhoto};
  if(role==='student'){
   const student={id,name,course:document.getElementById('regCourse').value.trim(),year:document.getElementById('regYear').value.trim(),room:document.getElementById('regRoom').value.trim(),block:document.getElementById('regBlock').value.trim(),phone:document.getElementById('regPhone').value.trim(),photo:uploadedPhoto,status:'Inside',fees:0};
   if(!student.course||!student.room||!student.block){error.textContent='Enter course, room and block.';return}
   students.push(student);
  }
  accounts.push(account);save();saveAccounts();e.target.reset();showLogin();
  document.getElementById('userId').value=id;
  document.getElementById('password').value=password;
  error.style.color='#248b50';error.textContent='Account created! You can now log in.';
 }catch(err){error.textContent=err.message||'Registration failed.'}
}
function login(e){
 e.preventDefault();
 const id=document.getElementById('userId').value.trim();
 const pass=document.getElementById('password').value;
 const error=document.getElementById('loginError');
 error.style.color='#d13e51';error.textContent='';
 let account=accounts.find(a=>a.id.toLowerCase()===id.toLowerCase()&&a.password===pass&&a.type===role);
 if(!account&&pass==='1234'){
  if(role==='warden'&&id==='warden1')account={id:'warden1',name:'Mr. R. Sharma',type:'warden',photo:''};
  else if(role==='student'){const s=students.find(x=>x.id===id);if(s)account={...s,type:'student'}}
 }
 if(!account){error.textContent='Invalid User ID, password or account type.';return}
 if(account.type==='student'){
  const s=students.find(x=>x.id===account.id);
  if(!s){error.textContent='Student record not found.';return}
  current={...s,type:'student'};logEvent(current.id,'Login');
 }else current={...account,type:'warden'};
 document.getElementById('loginPage').classList.add('hidden');
 document.getElementById('appPage').classList.remove('hidden');
 document.getElementById('logoutTop').classList.remove('hidden');
 tab='Home';render();
}
function logout(){
 if(current?.type==='student')logEvent(current.id,'Logout');
 current=null;
 document.getElementById('loginPage').classList.remove('hidden');
 document.getElementById('appPage').classList.add('hidden');
 document.getElementById('logoutTop').classList.add('hidden');
 document.getElementById('password').value='';showLogin();
}
function logEvent(id,event){logs.unshift({id,event,time:new Date().toLocaleString()});save()}
function photo(s){return s.photo||'https://ui-avatars.com/api/?name='+encodeURIComponent(s.name||'User')+'&background=ddd6fe&color=4935d5&size=128'}
function navItems(){
 return current.type==='warden'?
 [['Home','🏠'],['Students','👨‍🎓'],['Entry/Exit','🚪'],['Notices','📢'],['Food Menu','🍲'],['Complaints','💬'],['Fees','💳'],['Profile','👤']]:
 [['Home','🏠'],['Food Menu','🍲'],['Notices','📢'],['Complaints','💬'],['Fees','💳'],['Gate Timings','🚪'],['Profile','👤']];
}
function render(){
 document.getElementById('welcome').textContent='Hello, '+current.name+'!';
 document.getElementById('welcomeSub').textContent=current.type==='warden'?'Warden Dashboard · Sunrise Hostel':'Student Dashboard · Sunrise Hostel';
 document.getElementById('heroAvatar').src=current.photo||photo(current);
 document.getElementById('navigation').innerHTML=navItems().map(([name,icon])=>`<button class="${tab===name?'active':''}" onclick="go('${name}')">${icon} ${name}</button>`).join('');
 renderView();
}
function go(t){tab=t;render()}
function stat(icon,label,value){return `<div class="stat"><div class="emoji">${icon}</div><strong>${value}</strong><small>${label}</small></div>`}
function tile(name,icon){return `<button class="tile" onclick="go('${name}')"><span>${icon}</span><b>${name}</b></button>`}
function renderView(){
 const v=document.getElementById('view');
 if(tab==='Home'){
  if(current.type==='warden'){
   v.innerHTML=`<div class="stats">${stat('👨‍🎓','Total Students',students.length)}${stat('🟢','Inside Hostel',students.filter(s=>s.status==='Inside').length)}${stat('🚶','Outside Hostel',students.filter(s=>s.status==='Outside').length)}${stat('💬','Pending Complaints',complaints.filter(c=>c.status==='Pending').length)}</div><div class="layout"><div class="card"><h2>⚡ Quick Actions</h2><div class="tiles">${tile('Students','👨‍🎓')}${tile('Entry/Exit','🚪')}${tile('Notices','📢')}${tile('Food Menu','🍲')}${tile('Complaints','💬')}${tile('Fees','💳')}</div></div><div class="card"><h2>📢 Latest Announcements</h2>${noticeList(3)}</div></div><div class="card"><h2>🚪 Recent Student Activity</h2>${logTable(5)}</div>`;
  }else{
   const s=students.find(x=>x.id===current.id)||current;
   v.innerHTML=`<div class="grid"><div class="card"><div class="profile-row"><img class="avatar" src="${photo(s)}" alt="Student"><div><h3>${escapeHTML(s.name)}</h3><p class="muted">${escapeHTML(s.id)} · ${escapeHTML(s.course)}</p></div></div><hr style="border:0;border-top:1px solid #eee;margin:18px 0"><p>🏢 Sunrise Hostel</p><p class="muted">Block ${escapeHTML(s.block)} · Room ${escapeHTML(s.room)}</p><p>🚪 Gate: 06:00 AM – 09:30 PM</p><span class="badge">Hostel ${escapeHTML(s.status)}</span></div><div class="card"><h3>✨ Your Hostel Hub</h3><p class="muted">Check announcements, meals, fee information and raise complaints.</p><div class="tiles">${tile('Food Menu','🍲')}${tile('Notices','📢')}${tile('Complaints','💬')}${tile('Fees','💳')}</div></div></div><div class="card"><h2>📢 Latest Notices</h2>${noticeList(3)}</div><div class="card"><h2>🍽️ Today's Menu</h2><p>${escapeHTML(menu[(new Date().getDay()+6)%7])}</p></div>`;
  }
 }else if(tab==='Students')v.innerHTML=studentList();
 else if(tab==='Entry/Exit')v.innerHTML=entryPage();
 else if(tab==='Notices')v.innerHTML=noticePage();
 else if(tab==='Food Menu')v.innerHTML=menuPage();
 else if(tab==='Complaints')v.innerHTML=complaintPage();
 else if(tab==='Fees')v.innerHTML=feesPage();
 else if(tab==='Gate Timings')v.innerHTML=gatePage();
 else if(tab==='Profile')v.innerHTML=profilePage();
}
function noticeList(n){
 return notices.slice(0,n).map(x=>`<div class="item"><span class="badge blue">${escapeHTML(x.type)}</span><h3 style="margin-top:10px">${escapeHTML(x.title)}</h3><p class="muted">${escapeHTML(x.date)}</p><p style="font-size:14px;line-height:1.5">${escapeHTML(x.body)}</p></div>`).join('')||'<p class="muted">No announcements yet.</p>';
}
function noticePage(){
 return `<div class="card"><h2>📢 Announcements</h2>${current.type==='warden'?`<form onsubmit="addNotice(event)"><label>Title</label><input id="ntitle" required placeholder="Notice title"><label>Category</label><select id="ntype"><option>Important</option><option>Notice</option><option>General</option><option>Reminder</option></select><label>Message</label><textarea id="nbody" required placeholder="Write announcement"></textarea><button class="primary">Publish Notice</button></form>`:''}${noticeList(50)}</div>`;
}
function addNotice(e){
 e.preventDefault();
 notices.unshift({title:document.getElementById('ntitle').value,type:document.getElementById('ntype').value,date:new Date().toLocaleDateString(),body:document.getElementById('nbody').value});
 save();render();
}
function studentList(){
 return `<div class="card"><h2>👨‍🎓 Student Management</h2><input id="studentSearch" placeholder="Search name or student ID..." oninput="filterStudents()">${current.type==='warden'?`<button class="primary" onclick="addStudentForm()">＋ Add Student</button><div id="addStudentArea"></div>`:''}<div id="studentResults">${studentRows(students)}</div></div>`;
}
function studentRows(list){
 return `<div class="grid">${list.map(s=>`<div class="item"><div class="profile-row"><img class="avatar" src="${photo(s)}" alt=""><div><h3>${escapeHTML(s.name)}</h3><p class="muted">${escapeHTML(s.id)}</p></div></div><p class="muted">Course: ${escapeHTML(s.course)} · ${escapeHTML(s.year)}</p><p>🏠 Block ${escapeHTML(s.block)}, Room ${escapeHTML(s.room)}</p><p>📱 ${escapeHTML(s.phone)}</p><span class="badge ${s.status==='Outside'?'orange':''}">${escapeHTML(s.status)}</span> <button class="secondary" onclick="viewStudent('${s.id}')">View Details</button></div>`).join('')}</div>`;
}
function filterStudents(){
 const q=document.getElementById('studentSearch').value.toLowerCase();
 document.getElementById('studentResults').innerHTML=studentRows(students.filter(s=>(s.name+' '+s.id+' '+s.room).toLowerCase().includes(q)));
}
function addStudentForm(){
 document.getElementById('addStudentArea').innerHTML=`<form class="item" onsubmit="addStudent(event)"><label>Student ID</label><input id="sid" required><label>Full Name</label><input id="sname" required><label>Course</label><input id="scourse" required><label>Semester</label><input id="syear"><label>Room</label><input id="sroom" required><label>Block</label><input id="sblock" value="A" required><label>Phone</label><input id="sphone"><label>Profile Picture</label><input id="sphoto" type="file" accept="image/jpeg,image/png,image/webp"><label>Temporary Password</label><input id="spass" required minlength="4" type="password"><button class="primary">Save Student</button></form>`;
}
async function addStudent(e){
 e.preventDefault();
 const id=document.getElementById('sid').value.trim();
 if(students.some(s=>s.id.toLowerCase()===id.toLowerCase())||accounts.some(a=>a.id.toLowerCase()===id.toLowerCase())){alert('This student ID already exists.');return}
 try{
  const uploadedPhoto=await readPhoto(document.getElementById('sphoto').files[0]);
  const s={id,name:document.getElementById('sname').value.trim(),course:document.getElementById('scourse').value.trim(),year:document.getElementById('syear').value.trim(),room:document.getElementById('sroom').value.trim(),block:document.getElementById('sblock').value.trim(),phone:document.getElementById('sphone').value.trim(),photo:uploadedPhoto,status:'Inside',fees:0};
  students.push(s);
  accounts.push({id,name:s.name,password:document.getElementById('spass').value,type:'student',photo:uploadedPhoto});
  save();saveAccounts();render();
 }catch(err){alert(err.message)}
}
function viewStudent(id){
 const s=students.find(x=>x.id===id);
 if(s)alert(`STUDENT DETAILS\n\nName: ${s.name}\nID: ${s.id}\nCourse: ${s.course}\nSemester: ${s.year}\nBlock: ${s.block}\nRoom: ${s.room}\nPhone: ${s.phone}\nHostel status: ${s.status}\nPending fees: ₹${s.fees}`);
}
function entryPage(){
 return `<div class="card"><h2>🚪 Student Entry / Exit Register</h2><p class="muted">Warden can record student entry and exit.</p>${current.type==='warden'?`<form onsubmit="recordEvent(event)"><label>Student</label><select id="logStudent">${students.map(s=>`<option value="${s.id}">${escapeHTML(s.name)} (${s.id})</option>`).join('')}</select><label>Event</label><select id="logType"><option>Entry</option><option>Exit</option></select><button class="primary">Record Activity</button></form>`:''}<h3>Current Hostel Status</h3><div class="table-wrap"><table><tr><th>Student</th><th>Room</th><th>Status</th></tr>${students.map(s=>`<tr><td>${escapeHTML(s.name)}</td><td>${escapeHTML(s.room)}</td><td><span class="badge ${s.status==='Outside'?'orange':''}">${escapeHTML(s.status)}</span></td></tr>`).join('')}</table></div><h3 style="margin-top:25px">Activity History</h3>${logTable(100)}</div>`;
}
function recordEvent(e){
 e.preventDefault();
 const id=document.getElementById('logStudent').value,type=document.getElementById('logType').value,s=students.find(x=>x.id===id);
 if(!s)return;
 s.status=type==='Entry'?'Inside':'Outside';
 logs.unshift({id,event:type,time:new Date().toLocaleString()});
 save();render();
}
function logTable(n){
 const items=logs.slice(0,n);
 return items.length?`<div class="table-wrap"><table><tr><th>Student ID</th><th>Activity</th><th>Date / Time</th></tr>${items.map(l=>`<tr><td>${escapeHTML(l.id)}</td><td>${escapeHTML(l.event)}</td><td>${escapeHTML(l.time)}</td></tr>`).join('')}</table></div>`:'<p class="muted">No activity recorded yet.</p>';
}
function menuPage(){
 return `<div class="card"><h2>🍲 Weekly Food Menu</h2>${current.type==='warden'?`<form onsubmit="saveMenu(event)">`:''}${menu.map((m,i)=>`<div class="item"><h3>${['☀️ Monday','🌷 Tuesday','🌿 Wednesday','🍊 Thursday','🌸 Friday','🌊 Saturday','⭐ Sunday'][i]}</h3>${current.type==='warden'?`<input id="meal${i}" value="${escapeHTML(m)}" required>`:`<p>${escapeHTML(m)}</p>`}</div>`).join('')}${current.type==='warden'?`<button class="primary">Save Weekly Menu</button></form>`:''}</div>`;
}
function saveMenu(e){
 e.preventDefault();
 menu=menu.map((m,i)=>document.getElementById('meal'+i).value);
 save();alert('Weekly menu saved!');render();
}
function complaintPage(){
 return `<div class="card"><h2>💬 Complaints & Maintenance</h2>${current.type==='student'?`<form onsubmit="addComplaint(event)"><label>Describe your complaint</label><textarea id="complaintText" required placeholder="Water leakage, fan issue, food quality..." rows="3"></textarea><button class="primary">Submit Complaint</button></form>`:''}<h3>Complaint Records</h3>${complaints.length?complaints.map((c,i)=>`<div class="item"><h3>${escapeHTML(c.text)}</h3><p class="muted">${escapeHTML(c.name)} · Room ${escapeHTML(c.room)} · ${escapeHTML(c.date)}</p><span class="badge ${c.status==='Pending'?'orange':''}">${escapeHTML(c.status)}</span>${current.type==='warden'&&c.status==='Pending'?` <button class="secondary" onclick="resolveComplaint(${i})">Mark Resolved</button>`:''}</div>`).join(''):'<p class="muted">No complaints yet.</p>'}</div>`;
}
function addComplaint(e){
 e.preventDefault();
 complaints.unshift({name:current.name,room:current.room,text:document.getElementById('complaintText').value,status:'Pending',date:new Date().toLocaleDateString()});
 save();alert('Complaint submitted.');render();
}
function resolveComplaint(i){complaints[i].status='Resolved';save();render()}
function feesPage(){
 const s=current.type==='student'?students.find(x=>x.id===current.id):null;
 return `<div class="card"><h2>💳 Hostel Fee Details</h2>${s?`<div class="item"><h3>${escapeHTML(s.name)}</h3><p class="muted">Student ID: ${escapeHTML(s.id)}</p><h2>Pending Amount: ₹${s.fees.toLocaleString('en-IN')}</h2></div>`:''}${[1,2,3].map(i=>`<div class="item"><p><b>${i}${i===1?'st':i===2?'nd':'rd'} month</b><strong style="float:right">₹${Number(fees[i]).toLocaleString('en-IN')}</strong></p></div>`).join('')}${current.type==='warden'?`<form onsubmit="updateFees(event)"><h3>Update Monthly Fees</h3><label>Month</label><select id="feeSem"><option value="1">1st month</option><option value="2">2nd month</option><option value="3">3rd month</option></select><label>Amount (₹)</label><input id="feeAmount" type="number" min="0" required><button class="primary">Update Fees</button></form><h3>Student Pending Fees</h3>${students.map(st=>`<div class="item">${escapeHTML(st.name)} (${escapeHTML(st.id)}) — ₹${st.fees.toLocaleString('en-IN')} <button class="secondary" onclick="setPaid('${st.id}')">Mark Paid</button></div>`).join('')}`:`<div class="notice">This demo does not process payments.</div>`}</div>`;
}
function updateFees(e){
 e.preventDefault();
 fees[document.getElementById('feeSem').value]=Number(document.getElementById('feeAmount').value);
 save();render();
}
function setPaid(id){const s=students.find(x=>x.id===id);if(s){s.fees=0;save();render()}}
function gatePage(){
 return `<div class="card"><h2>🚪 Gate Opening & Closing</h2><div class="center" style="padding:22px;background:#eefff6;border-radius:16px"><div style="font-size:42px">🕕</div><h2>06:00 AM – 09:30 PM</h2><span class="badge">Regular Gate Timings</span></div><h3 style="margin-top:20px">Important Rules</h3><div class="item">🪪 Students should carry their ID card.</div><div class="item">🌙 After closing time, follow hostel rules and contact the warden.</div><div class="item">📞 Emergency situations should be reported to the warden.</div><p class="muted">Sample project settings. Confirm actual timings with your hostel.</p></div>`;
}
function profilePage(){
 const s=current.type==='student'?students.find(x=>x.id===current.id):null;
 const pic=s?s.photo:current.photo;
 return `<div class="card"><h2>👤 My Profile</h2><div class="profile-row"><img class="avatar" src="${pic||photo({name:current.name})}" alt="Profile"><div><h3>${escapeHTML(current.name)}</h3><p class="muted">${current.type==='warden'?'Hostel Warden':escapeHTML(s.id)}</p></div></div>${s?`<div class="item"><p>🎓 Course: ${escapeHTML(s.course)}</p><p>📚 Semester: ${escapeHTML(s.year)}</p><p>🏠 Hostel: Sunrise Hostel</p><p>🛏️ Room: ${escapeHTML(s.room)} · Block ${escapeHTML(s.block)}</p><p>📱 Phone: ${escapeHTML(s.phone)}</p></div>`:''}<form onsubmit="updateProfile(event)"><h3>Update Profile</h3><label>Full Name</label><input id="editName" value="${escapeHTML(current.name)}" required>${s?`<label>Phone</label><input id="editPhone" value="${escapeHTML(s.phone)}">`:''}<label>Upload New Profile Picture</label><input id="editPhoto" type="file" accept="image/jpeg,image/png,image/webp"><button class="primary">Save Profile</button></form><button class="danger" onclick="logout()">Logout</button></div>`;
}
async function updateProfile(e){
 e.preventDefault();
 try{
  const file=document.getElementById('editPhoto').files[0];
  const uploadedPhoto=await readPhoto(file);
  const name=document.getElementById('editName').value.trim();
  if(current.type==='student'){
   const s=students.find(x=>x.id===current.id);
   if(!s)return;
   s.name=name;s.phone=document.getElementById('editPhone').value.trim();
   if(file)s.photo=uploadedPhoto;
   current={...s,type:'student'};
   const a=accounts.find(x=>x.id===s.id);
   if(a){a.name=s.name;if(file)a.photo=s.photo}
  }else{
   current.name=name;
   if(file)current.photo=uploadedPhoto;
   const a=accounts.find(x=>x.id===current.id);
   if(a){a.name=name;if(file)a.photo=uploadedPhoto}
  }
  save();saveAccounts();render();alert('Profile updated successfully!');
 }catch(err){alert(err.message||'Could not update profile.')}
}
</script>
</body>
</html>
